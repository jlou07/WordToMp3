<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">From document to MP3: converter architecture</title>
  <desc id="desc">Local extraction, normalization and splitting, remote Azure synthesis with a local WAV cache, then assembly and verification using FFmpeg.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1120" height="650" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
    <text x="40" y="50" font-size="28" font-weight="700">One long document, one MP3 file</text>
    <text x="40" y="82" font-size="17">Illustration based on the implementation - not a screenshot</text>
    <rect x="30" y="110" width="1060" height="165" rx="16" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="50" y="141" font-size="18" font-weight="700">1. Local preparation - Windows</text>
    <rect x="50" y="163" width="270" height="85" rx="10" fill="white"/>
    <text x="68" y="193" font-size="19" font-weight="700">DOC / DOCX / TXT</text>
    <text x="68" y="222" font-size="16">Word COM or UTF-8 input</text>
    <rect x="410" y="163" width="270" height="85" rx="10" fill="white"/>
    <text x="428" y="193" font-size="19" font-weight="700">Normalization</text>
    <text x="428" y="222" font-size="16">Spaces, newlines, controls</text>
    <rect x="770" y="163" width="295" height="85" rx="10" fill="white"/>
    <text x="788" y="193" font-size="19" font-weight="700">Splitting</text>
    <text x="788" y="222" font-size="16">2,000 characters by default</text>
    <rect x="30" y="308" width="1060" height="145" rx="16" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="50" y="339" font-size="18" font-weight="700">2. For each chunk: reuse or synthesize</text>
    <text x="55" y="378" font-size="18">Valid cached WAV?</text>
    <text x="55" y="411" font-size="16">Yes: no new synthesis call</text>
    <rect x="460" y="355" width="340" height="73" rx="10" fill="white"/>
    <text x="478" y="383" font-size="19" font-weight="700">Otherwise: Azure Speech</text>
    <text x="478" y="409" font-size="16">Chunk text leaves the computer</text>
    <text x="850" y="383" font-size="18" font-weight="700">Local WAV</text>
    <text x="850" y="410" font-size="16">24 kHz / 16 bits / mono</text>
    <rect x="30" y="486" width="1060" height="120" rx="16" fill="#dcfce7" stroke="#16a34a"/>
    <text x="50" y="517" font-size="18" font-weight="700">3. Local finalization - FFmpeg</text>
    <text x="55" y="559" font-size="19">Ordered WAVs</text>
    <text x="320" y="559" font-size="19">128 kbit/s MP3 encoding</text>
    <text x="660" y="559" font-size="19">Decode validation</text>
    <text x="960" y="559" font-size="19" font-weight="700">Final MP3</text>
    <text x="40" y="634" font-size="15">--dry-run stops after preparation: no Azure calls and no audio output.</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <path d="M325 204 H400"/><path d="M685 204 H760"/>
    <path d="M915 278 V298"/><path d="M370 389 H450"/>
    <path d="M805 389 H839"/><path d="M965 457 V476"/>
    <path d="M220 551 H301"/><path d="M565 551 H641"/><path d="M855 551 H944"/>
  </g>
</svg>
